<div class="flex items-center justify-center min-h-[50vh]">
  <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border border-slate-100">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-100 mb-4">
        <svg class="w-8 h-8 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.5"
            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8V7a4 4 0 00-8 0v4h8z"
          />
        </svg>
      </div>
      <h2 class="text-2xl font-black text-slate-800">Acceso Protegido</h2>
      <p class="text-slate-500 mt-2">Introduce tus credenciales para acceder a esta sección.</p>
    </div>

    <form (submit)="onSubmit(); $event.preventDefault()">
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1" for="username"
            >Nombre de usuario</label
          >
          <input
            type="text"
            id="username"
            [ngModel]="username()"
            (ngModelChange)="username.set($event)"
            name="username"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-lime-500 focus:border-transparent transition-all"
            placeholder="admin"
            required
          />
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1" for="password"
            >Contraseña</label
          >
          <input
            type="password"
            id="password"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            name="password"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-lime-500 focus:border-transparent transition-all"
            placeholder="123"
            required
          />
        </div>
      </div>

      @if (error()) {
        <div
          class="mt-4 p-3 rounded-lg bg-rose-50 text-rose-500 text-sm font-medium border border-rose-100 flex items-center gap-2 animate-in slide-in-from-top-1"
        >
          <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
            />
          </svg>
          Credenciales incorrectas.
        </div>
      }

      <button
        type="submit"
        class="w-full mt-8 bg-slate-800 hover:bg-lime-500 text-white font-bold py-3 px-4 rounded-xl transition-colors shadow-md flex items-center justify-center gap-2"
      >
        Entrar
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M14 5l7 7m0 0l-7 7m7-7H3"
          />
        </svg>
      </button>
    </form>
  </div>
</div>
